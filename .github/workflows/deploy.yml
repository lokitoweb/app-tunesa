# Despliegue a producción por SSH al hacer push a master.
#
# Se conecta al servidor y corre scripts/deploy.sh, que hace git pull del commit, composer install --no-dev,
# npm ci + npm run build, migrate --force y config/route/view/event:cache (ver el script).
#
# Está APAGADO hasta que crees la variable de repositorio DEPLOY_MODE=actions
# (Settings → Secrets and variables → Actions → Variables). Apagado, el job se salta y no gasta minutos.
# Si prefieres no depender de minutos de GitHub Actions, deja DEPLOY_MODE sin definir y usa el modo cron
# del servidor (docs/deployment/produccion-servidor.md, "Opción B").
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   DEPLOY_HOST         IP o dominio del servidor
#   DEPLOY_USER         usuario SSH que despliega (ej. deploy)
#   DEPLOY_SSH_KEY      llave privada SSH (ed25519) de ese usuario, completa
#   DEPLOY_PATH         carpeta del proyecto en el servidor (ej. /var/www/tunesa)
#   DEPLOY_KNOWN_HOSTS  salida de `ssh-keyscan -p <puerto> <host>` (fija la huella del servidor)
#   DEPLOY_PORT         opcional, por defecto 22
# Variables opcionales: PHP_FPM_SERVICE (ej. php8.3-fpm), que el script recarga al final para limpiar OPcache,
# y PRODUCTION_URL (por defecto https://group-cyp.com), donde se comprueba /up después del deploy.
name: "Deploy: producción"

on:
  push:
    branches: [master]
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/mobile-apk.yml"
      - ".github/workflows/app-e2e.yml"
  workflow_dispatch:

# Nunca dos despliegues a la vez; uno nuevo espera a que termine el anterior
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_MODE == 'actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Llave SSH y huella del servidor
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Faltan secrets DEPLOY_HOST, DEPLOY_SSH_KEY o DEPLOY_KNOWN_HOSTS"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Desplegar ${{ github.sha }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          FPM: ${{ vars.PHP_FPM_SERVICE }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 "$USER@$HOST" \
            "cd '$APP_PATH' && PHP_FPM_SERVICE='$FPM' bash scripts/deploy.sh --ref '${{ github.sha }}'"

      - name: Verificar ${{ vars.PRODUCTION_URL || 'https://group-cyp.com' }}/up
        env:
          URL: ${{ vars.PRODUCTION_URL || 'https://group-cyp.com' }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL/up" || true)
            echo "Intento $i: $URL/up → $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$URL/up no respondió 200 después del deploy"
          exit 1

      - name: Borrar la llave
        if: always()
        run: rm -f ~/.ssh/deploy_key
