# Pruebas de punta a punta de la app contra el backend real (sembrado con DatabaseSeeder).
#
# - api-contract: los repositorios y modelos de la app (mobile/test/e2e) contra la API:
#   login, marcaciones, solicitudes, aprobación, legajo, boletas, capacitaciones,
#   notificaciones, privacidad y cierre de sesión.
# - android: la app instalada en emuladores Android 10 y Android 15 recorre todos los
#   menús como colaborador y como supervisor (mobile/integration_test). Falla si una
#   pantalla muestra error o algo se desborda.
name: "App ↔ API: pruebas de punta a punta"

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "mobile/**"
      - "app/**"
      - "routes/**"
      - "database/**"
      - "config/**"
      - "resources/views/**"
      - ".github/workflows/app-e2e.yml"
  workflow_dispatch:

concurrency:
  group: app-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Backend sembrado
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
          # El turno de Ana es Lun-Vie: en fin de semana RRHH autoriza su marcación para recorrer el flujo completo
          php artisan tinker --execute='$u = App\Modules\Core\Models\User::withoutGlobalScopes()->where("email", "ana.torres@empresa-demo.com")->firstOrFail(); App\Modules\Attendance\Models\OffShiftAuthorization::create(["tenant_id" => $u->tenant_id, "user_id" => $u->id, "work_date" => now($u->tenant->timezone)->toDateString(), "reason" => "CI"]);'
          nohup php artisan serve --host 127.0.0.1 --port 8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/app/config > /dev/null && break; sleep 1; done

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Repositorios de la app contra la API
        working-directory: mobile
        run: |
          flutter pub get
          flutter test test/e2e --dart-define=E2E=true --dart-define=API_BASE_URL=http://127.0.0.1:8000

      - name: Log del backend
        if: failure()
        run: tail -n 200 storage/logs/*.log

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Backend sembrado (el emulador lo ve en 10.0.2.2:8000)
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          sed -i 's|^APP_URL=.*|APP_URL=http://10.0.2.2:8000|' .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
          nohup php artisan serve --host 0.0.0.0 --port 8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/app/config > /dev/null && break; sleep 1; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # El emulador pide ~7 GB para su partición de datos y la compilación ocupa varios GB más
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /opt/microsoft \
            /opt/google /usr/local/julia* /usr/lib/google-cloud-sdk /usr/share/miniconda
          sudo docker image prune -af > /dev/null || true
          # El AVD va al disco temporal del runner (/mnt) para no competir con la compilación
          sudo mkdir -p /mnt/avd && sudo chown "$USER" /mnt/avd
          echo "ANDROID_AVD_HOME=/mnt/avd" >> "$GITHUB_ENV"
          df -h / /mnt

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Compila antes de arrancar el emulador: Gradle y la descarga del NDK
      # compitiendo con el emulador dejaban al runner sin recursos
      - name: Compilar la app de prueba
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug --dart-define-from-file=env/dev.json

      - name: Recorrido de la app en el emulador (Android API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        # El recorrido tarda ~3 min con el arranque. A veces el emulador no termina tras
        # "emu kill" (las pruebas ya pasaron): falla aquí y no a los 60 min del job; se relanza el job
        timeout-minutes: 25
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: flutter test integration_test --dart-define-from-file=env/dev.json -d emulator-5554 --reporter expanded

      - name: Log del backend
        if: failure()
        run: tail -n 200 storage/logs/*.log
