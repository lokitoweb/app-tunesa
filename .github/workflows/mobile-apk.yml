# Compila el APK de la app Flutter (mobile/).
#
# - En cada PR / push que toque mobile/: analiza, prueba y genera un APK de prueba.
# - Manual (Actions → "App móvil: APK" → Run workflow): elige entorno y modo.
# - Al publicar un tag v* (ej: v0.2.0) adjunta el APK release al GitHub Release.
#
# Firma de producción (opcional): secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD. Sin ellos el APK sale firmado con la llave debug.
# Dominio del backend: env/<entorno>.json (prod = https://group-cyp.com). Lo sobrescriben el input api_base_url
# del Run workflow o, solo en entornos que no son prod, la variable de repositorio API_BASE_URL (así una URL de
# túnel guardada ahí nunca termina en el APK de producción). Túnel de pruebas: entorno "tunnel" + api_base_url.
# scripts/build_apk.sh exige la llave para prod; ALLOW_DEBUG_SIGNING=1 mantiene el APK de prueba
# firmado con la llave debug cuando no hay secrets, salvo al publicar un tag v*.
# Manual: además compila iOS (macos-15): .ipa sin firma siempre y firmada si hay secrets IOS_* (ver job ios).
# Push (opcional): FIREBASE_API_KEY, FIREBASE_APP_ID, FIREBASE_MESSAGING_SENDER_ID, FIREBASE_PROJECT_ID,
# FIREBASE_IOS_APP_ID y FIREBASE_IOS_BUNDLE_ID como secrets o variables de repositorio. Solo los no
# vacíos se pasan como --dart-define; sin ellos el APK compila igual con el push apagado.
# Release: además el .aab para Google Play, revisado con scripts/check_play_requirements.py (targetSdk 36,
# permisos permitidos y librerías alineadas a 16 KB). Dart ofuscado (--obfuscate) y símbolos como artefacto tunesa-symbols-*. Variable de repositorio
# APP_CERT_SHA256 (opcional): huella de la llave de firma (y la de Google Play) para detectar APK re-firmados.
name: "App móvil: APK"

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno (archivo mobile/env/<entorno>.json)"
        type: choice
        options: [prod, staging, tunnel, dev]
        default: prod
      api_base_url:
        description: "URL del backend (opcional). Ej: https://xxxx.trycloudflare.com — sobrescribe API_BASE_URL del JSON"
        type: string
        required: false
      mode:
        description: "Modo de compilación"
        type: choice
        options: [release, debug]
        default: release
      build_ios:
        description: "Compilar también iOS (.ipa) en macOS"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      ENV_NAME: ${{ inputs.environment || 'prod' }}
      BUILD_MODE: ${{ inputs.mode || 'release' }}
      API_BASE_URL: ${{ inputs.api_base_url || ((inputs.environment || 'prod') != 'prod' && vars.API_BASE_URL) || '' }}
      ALLOW_DEBUG_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
      # Release: también el .aab para Google Play (y la revisión de targetSdk, permisos y 16 KB)
      BUILD_AAB: ${{ (inputs.mode || 'release') == 'release' && '1' || '0' }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
      FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID || vars.FIREBASE_IOS_APP_ID }}
      FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID || vars.FIREBASE_IOS_BUNDLE_ID }}
      APP_CERT_SHA256: ${{ vars.APP_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # APK y AAB en release ocupan varios GB; el runner a veces se queda sin disco
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /opt/az /opt/microsoft /usr/lib/google-cloud-sdk
          df -h /

      - name: Llave de firma (si hay secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Sin secrets de firma: el APK se firma con la llave debug (solo pruebas)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Analizar, probar y compilar
        run: scripts/build_apk.sh "$ENV_NAME" "$BUILD_MODE"

      - uses: actions/upload-artifact@v4
        with:
          name: tunesa-apk-${{ env.ENV_NAME }}-${{ env.BUILD_MODE }}
          path: |
            mobile/build/dist/*.apk
            mobile/build/dist/*.aab
            !mobile/build/dist/*-arm64.apk
          retention-days: 14

      # Descarga liviana para probar en el celular (arm64, la mayoría de Android)
      - uses: actions/upload-artifact@v4
        with:
          name: tunesa-apk-${{ env.ENV_NAME }}-${{ env.BUILD_MODE }}-arm64-liviano
          path: mobile/build/dist/*-arm64.apk
          compression-level: 0
          retention-days: 14

      # Símbolos del código ofuscado: sin ellos las trazas de errores son ilegibles
      - uses: actions/upload-artifact@v4
        if: env.BUILD_MODE == 'release'
        with:
          name: tunesa-symbols-${{ env.ENV_NAME }}-${{ github.sha }}
          path: mobile/build/debug-info/
          retention-days: 90

      - name: Adjuntar al release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/dist/*.apk
            mobile/build/dist/*.aab

      - name: Borrar llave de firma
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

  ios:
    # Solo manual (Run workflow con "Compilar iOS" marcado). macOS cuesta 10 veces más minutos.
    # Sin secrets de Apple sale una .ipa SIN FIRMA (sirve para verificar que compila; para
    # instalarla hay que firmarla). Con los secrets IOS_* sale además la .ipa firmada:
    #   IOS_CERTIFICATE_P12_BASE64   certificado "Apple Distribution" exportado como .p12, en base64
    #   IOS_CERTIFICATE_PASSWORD     contraseña del .p12
    #   IOS_PROVISIONING_PROFILE_BASE64  perfil .mobileprovision (Ad Hoc o App Store) en base64
    #   IOS_TEAM_ID                  Team ID de la cuenta de Apple Developer (10 caracteres)
    # Variable de repositorio IOS_EXPORT_METHOD: ad-hoc (por defecto) o app-store-connect.
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    # Etiqueta fija: macos-latest cambia de imagen sin aviso y en horas pico GitHub
    # no le asigna runner ("The job was not acquired by Runner"). Si vuelve a pasar,
    # se reintenta con Run workflow; no es un error del código.
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      ENV_NAME: ${{ inputs.environment || 'prod' }}
      API_BASE_URL: ${{ inputs.api_base_url || ((inputs.environment || 'prod') != 'prod' && vars.API_BASE_URL) || '' }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
      FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID || vars.FIREBASE_IOS_APP_ID }}
      FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID || vars.FIREBASE_IOS_BUNDLE_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # connectivity_plus 7.3 usa NWPath.isUltraConstrained (SDK de iOS 26): con Xcode 16
      # no compila. Se elige el Xcode 26 más nuevo instalado en la imagen.
      - name: Elegir Xcode 26 o superior
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            echo "::error::La imagen no tiene Xcode 26 o superior (instalados: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' '))."
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          pod --version

      - name: Dependencias (Dart y CocoaPods)
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Defines de compilación
        run: |
          EXTRA=""
          if [ -n "$API_BASE_URL" ]; then EXTRA="$EXTRA --dart-define=API_BASE_URL=$API_BASE_URL"; fi
          for VAR in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_IOS_APP_ID FIREBASE_IOS_BUNDLE_ID; do
            if [ -n "${!VAR}" ]; then EXTRA="$EXTRA --dart-define=$VAR=${!VAR}"; fi
          done
          echo "IOS_DEFINES=$EXTRA" >> "$GITHUB_ENV"

      - name: Compilar iOS sin firma
        run: |
          # shellcheck disable=SC2086
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/debug-info/ios \
            --dart-define-from-file="env/$ENV_NAME.json" $IOS_DEFINES

      # .ipa sin firma: Payload/Runner.app comprimido (no se instala hasta firmarla)
      - name: Empaquetar .ipa sin firma
        run: |
          mkdir -p build/dist build/ipa-unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa-unsigned/Payload/
          (cd build/ipa-unsigned && zip -qry "../dist/tunesa-ios-${ENV_NAME}-unsigned.ipa" Payload)
          ls -lh build/dist

      - name: Certificado y perfil de Apple (si hay secrets)
        id: signing
        run: |
          if [ -z "$IOS_CERTIFICATE_P12_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] || [ -z "$IOS_TEAM_ID" ]; then
            echo "::notice::Sin secrets IOS_*: solo se entrega la .ipa sin firma."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/tunesa.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#*.}"
          PROJECT_BUNDLE_ID=$(grep -m1 -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;.]*\.[^;]*;' ios/Runner.xcodeproj/project.pbxproj | grep -v RunnerTests | sed 's/PRODUCT_BUNDLE_IDENTIFIER = //; s/;//')
          if [ "$BUNDLE_ID" != "$PROJECT_BUNDLE_ID" ]; then
            echo "::error::El perfil es para $BUNDLE_ID pero la app es $PROJECT_BUNDLE_ID. Crea el perfil con ese Bundle ID en developer.apple.com."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          # Firma manual solo en CI (Flutter/Release.xcconfig lo incluye si existe; está en .gitignore)
          cat > ios/Flutter/Signing.xcconfig <<XCCONFIG
          DEVELOPMENT_TEAM=$IOS_TEAM_ID
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER=$UUID
          XCCONFIG
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$IOS_EXPORT_METHOD</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$UUID</string></dict>
          </dict></plist>
          PLIST
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Compilar .ipa firmada
        if: steps.signing.outputs.enabled == 'true'
        run: |
          # shellcheck disable=SC2086
          flutter build ipa --release --obfuscate --split-debug-info=build/debug-info/ios \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define-from-file="env/$ENV_NAME.json" $IOS_DEFINES
          cp build/ios/ipa/*.ipa "build/dist/tunesa-ios-${ENV_NAME}-${IOS_EXPORT_METHOD}.ipa"
          ls -lh build/dist

      - uses: actions/upload-artifact@v4
        with:
          name: tunesa-ios-${{ env.ENV_NAME }}
          path: mobile/build/dist/*.ipa
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: tunesa-ios-symbols-${{ env.ENV_NAME }}-${{ github.sha }}
          path: mobile/build/debug-info/ios/
          retention-days: 90

      - name: Borrar certificado y perfil
        if: always()
        run: |
          rm -f ios/Flutter/Signing.xcconfig "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          security delete-keychain "$RUNNER_TEMP/tunesa.keychain-db" 2>/dev/null || true
