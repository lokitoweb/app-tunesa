name: "Backend: pruebas"

on:
  push:
    branches: [master]
  pull_request:
    paths-ignore: ["mobile/**"]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Avisos de seguridad de dependencias
        run: composer audit

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPUnit
        run: php artisan test

  # Producción usa MySQL: SQLite deja pasar columnas inexistentes entre comillas, defaults en JSON,
  # textos más largos que la columna y llaves JSON en otro orden. Solo en master para ahorrar minutos.
  phpunit-mysql:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tunesa_test
          MYSQL_USER: tunesa
          MYSQL_PASSWORD: secret
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
        ports: ["3306:3306"]
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tunesa_test
      DB_USERNAME: tunesa
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, gd, zip
          coverage: none

      - name: log_bin_trust_function_creators (triggers sin SUPER, igual que en el servidor)
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPUnit en MySQL 8
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Compilar pantallas Vue (un chunk por módulo)
        run: npm run build

      - name: Chunks por módulo y sin sourcemaps
        run: |
          ls public/build/assets
          for chunk in core hr integrations training; do ls public/build/assets/$chunk-*.js; done
          ! ls public/build/assets/*.map 2>/dev/null

  # El servidor despliega la rama "production", no master (scripts/deploy.sh). Solo avanza cuando las
  # tres pruebas pasan en un push a master: un commit roto nunca llega a producción.
  deployable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [phpunit, phpunit-mysql, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Un push más nuevo que termine antes no puede ser pisado por uno viejo
    concurrency:
      group: deployable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mover production a este commit (solo hacia adelante)
        run: |
          git fetch origin production || true
          if git rev-parse --verify -q origin/production >/dev/null \
             && ! git merge-base --is-ancestor origin/production "$GITHUB_SHA"; then
            echo "::notice::production ya está en un commit más nuevo; no se retrocede."
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/production"
          echo "::notice::production → ${GITHUB_SHA::7}: el servidor lo despliega en máximo 2 minutos."
