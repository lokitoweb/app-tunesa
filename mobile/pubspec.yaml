name: tunesa_mobile
description: "App de colaboradores: marcación de asistencia con GPS y selfie, solicitudes y boletas de pago."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  camera: ^0.12.1
  connectivity_plus: ^7.3.2
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  go_router: ^18.0.2
  google_mlkit_face_detection: ^0.15.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.2
  sqflite_sqlcipher: ^3.4.1
  uuid: ^4.6.0
  share_plus: ^13.3.1
  lottie: ^3.6.1

# connectivity_plus 7.3 (nm) exige dbus 0.8 y flutter_local_notifications_linux
# declara ^0.7.8. dbus solo se usa en Linux de escritorio (no se compila).
dependency_overrides:
  dbus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/gifts/
