# 4 GB de heap: con 8 GB + 4 GB de metaspace el runner de CI (y equipos con poca RAM) se quedaba
# sin memoria a mitad de assembleRelease y el sistema mataba el proceso (exit 143).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
